 if(tab=='orders')b=O.length?`<div class="row" style="justify-content:space-between"><span class="m">${O.length} order(s)</span><button class="d" onclick="clearOrders()">Clear all orders</button></div><div class="box sc"><table><tr><th>ID</th><th>Customer</th><th>Item</th><th>Amount</th><th>Status</th></tr>${O.map(o=>{const cur=LEG[o.status]||o.status;return `<tr><td>${o.id}<br><span class="m">${new Date(o.date).toLocaleDateString()}</span></td><td>${esc(o.cust.name)}<br>${esc(o.cust.phone)}<br><span class="m">${esc(o.cust.address)}, ${esc(o.cust.city)}, ${esc(o.cust.state)} ${esc(o.cust.pin)}</span></td><td>${esc(o.pname)}<br>${o.size} ×${o.qty}</td><td>${inr(o.unit*o.qty)}<br>−${o.pct}% = <b>${inr(o.final)}</b><br><span class="m">Profit:</span> <b class="ok">${inr(o.final-costOf(o))}</b><br><span class="m">Customer wants:</span> <b>${o.payment}</b></td><td><select onchange="orderService.updateStatus('${o.id}',this.value)">${[...new Set([...STATUS,cur,'Cancelled'])].map(x=>`<option ${x==cur?'selected':''}>${x}</option>`).join('')}</select><br><a class="btn o" style="margin-top:6px" target="_blank" rel="noopener" href="${custWaLink(o)}">Tell customer</a> <button class="d" onclick="delOrder('${o.id}')">✕</button></td></tr>`}).join('')}</table></div>`:empty('','No orders yet','Orders will appear here.');
 if(tab=='profit'){const act=O.filter(o=>pfMode=='del'?o.status=='Delivered':o.status!='Cancelled');
  const rows=P.flatMap(p=>SIZES.filter(z=>p.sizes[z]).map(z=>{const os=act.filter(o=>o.pid==p.id&&o.size==z),q=os.reduce((a,o)=>a+o.qty,0),rev=os.reduce((a,o)=>a+o.final,0),mc=cz(p,z,'mcost'),dc=cz(p,z,'dcost'),cost=q*(mc+dc);return{p,z,mc,dc,q,rev,cost,pr:rev-cost}})).filter(r=>r.q||true);
  const T=rows.reduce((a,r)=>({q:a.q+r.q,rev:a.rev+r.rev,cost:a.cost+r.cost,pr:a.pr+r.pr}),{q:0,rev:0,cost:0,pr:0});

 if(tab=='posts'){newImgs=[];b=`<div class="box"><h2>New post</h2><textarea id="pt" placeholder="Caption (e.g. New collection Friday!)"></textarea><select id="pk"><option value="up">Upcoming T-shirt (shows in “Upcoming T-shirts” on home)</option><option value="">Normal post</option></select><b>T-shirt photos</b> <span class="m">(up to 4, optional)</span><input type="file" accept="image/*" multiple onchange="pickImgs(this)"><div id="pprev" class="thumbs"></div><input id="pv" placeholder="YouTube video link (optional)"><select id="pp"><option value="">No linked product</option>${P.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><p id="err" class="er"></p><button onclick="addPost()">Post</button></div>${DB.posts.filter(p=>p.shopId==s.id).reverse().map(postHtml).join('')||empty('','No posts','')}`}
if(tab=='profile')b=`<div class="box" style="padding:0;overflow:hidden"><div class="ban" style="height:180px;border-radius:0"><img src="${banUrl(s)}" alt=""></div><div class="row" style="margin-top:-46px;padding:0 18px"><img class="bigav" src="${avUrl(s)}" alt=""></div><div class="row" style="padding:12px 18px 18px"><label class="btn o">Change profile photo<input type="file" accept="image/*" style="display:none" onchange="setMedia('avatar',this)"></label><label class="btn o">Change banner<input type="file" accept="image/*" style="display:none" onchange="setMedia('banner',this)"></label></div></div><div class="box"><h2>Shop profile</h2><input id="sn" value="${esc(s.name)}"><textarea id="sb">${esc(s.bio)}</textarea><button onclick="saveShop()">Save</button></div>`;
 if(tab=='settings')b=`<div class="box"><h2>Contact details</h2><p class="m">Only visible to you after login.</p><label class="m">Gmail</label><input id="se" type="email" value="${esc(s.email)}"><label class="m">WhatsApp number (with country code)</label><input id="sw" value="${esc(s.wa)}" inputmode="numeric"><button onclick="saveContact()">Save</button></div>
<div class="box"><h2>Login alerts</h2><p class="m">${(s.cmKey||NOTIFY_KEY)?'<span class="ok">Active</span> — a WhatsApp message is sent to your number on every successful login.':'<span class="er">Not active</span> — add your CallMeBot key to get a WhatsApp message on every login.'}</p><input id="sk" value="${esc(s.cmKey||'')}" placeholder="CallMeBot API key"><div class="note">One-time setup: save <b>+34 644 51 95 23</b> in your contacts, send it this WhatsApp message: <b>I allow callmebot to send me messages</b>, then paste the API key it replies with. (The key belongs to the number that activated it.)</div><button onclick="saveKey()">Save key</button> <button class="o" onclick="testAlert()">Send test</button> <button class="o" onclick="openTest()">Check key (shows reply)</button><div class="note" style="margin-top:10px"><b>Not receiving?</b> Tap “Check key”: a page opens with CallMeBot’s real reply. If it says the key is invalid or the number is wrong, redo the activation from <b>8240095460</b>’s WhatsApp. Alerts only fire on a <b>new</b> login, so tap Logout first, then log in again.</div></div>
<div class="box"><h2>Change password</h2><input id="cp0" type="password" placeholder="Current password"><input id="cp1" type="password" placeholder="New password (8+ characters)"><input id="cp2" type="password" placeholder="Repeat new password"><p id="err" class="er"></p><button onclick="savePw()">Update password</button></div>
<div class="box"><h2>Recent logins</h2>${(DB.loginLog||[]).slice().reverse().map(l=>`<div class="m">${esc(l.t)} · ${esc(l.dev)}</div>`).join('')||'<p class="m">None yet.</p>'}</div>`;
 return `<h2>${esc(s.name)} — Dashboard</h2>${nav}${(s.cmKey||NOTIFY_KEY)?'':'<div class="note" style="margin-top:12px">⚠️ <b>WhatsApp login alerts are not active yet.</b> They need a free CallMeBot key. <a href="#/dash/settings"><u>Set up now</u></a></div>'}${b}`};
function setStock(pid,z,v){const n=+v;if(!Number.isInteger(n)||n<0)return toast('Invalid stock');productService.get(pid).sizes[z].stock=n;storageService.save();toast('Stock updated')}
function delProd(id){if(confirm('Delete product?')){DB.products=DB.products.filter(p=>p.id!=id);storageService.save();route()}}
function addProd(){const f={name:$('pn').value,desc:$('pd').value,cat:$('pcc').value.trim()||$('pc').value,bm:$('bm').value,bp:$('bp').value,imgs:newImgs.slice()};SIZES.forEach(z=>{f['on'+z]=$('on'+z).checked;f['pr'+z]=$('pr'+z).value;f['st'+z]=$('st'+z).value;f['mc'+z]=$('mc'+z).value;f['dc'+z]=$('dc'+z).value});
 try{const e=productService.create(mySeller(),f);if(e)return $('err').textContent=e;location.hash='#/dash/products'}catch(x){$('err').textContent=String(x)}}
function addPost(){const tx=$('pt').value.trim(),v=$('pv').value.trim(),yt=ytId(v);if(!tx&&!newImgs.length&&!v)return toast('Add a caption, photo or video link');if(v&&!yt)return $('err').textContent='That does not look like a YouTube link';
 DB.posts.push({id:'po'+uid(),shopId:mySeller().id,text:tx,pid:$('pp').value,upcoming:$('pk').value=='up',imgs:newImgs.slice(),yt,date:new Date().toISOString(),likes:[],comments:[]});newImgs=[];storageService.save();toast('Posted');route()}

const avUrl=s=>s.avatar||ph(s.name[0],s.hue),banUrl=s=>s.bannerImg||ph('',s.banner);
function doLogin(){const e=authService.loginSeller($('lp').value);e?$('err').textContent=e:location.hash='#/dash/overview'}
const waNum=n=>{n=String(n||'').replace(/\D/g,'');return n.length==10?'91'+n:n};
const waUrl=text=>{const s=DB.shops[0],key=s.cmKey||NOTIFY_KEY;return (!key||!s.wa)?'':'https://api.callmebot.com/whatsapp.php?phone='+encodeURIComponent('+'+waNum(s.wa))+'&text='+encodeURIComponent(text)+'&apikey='+encodeURIComponent(key)};
function sendWa(text){const u=waUrl(text);if(!u)return false;
 try{fetch(u,{mode:'no-cors',keepalive:true}).catch(()=>{})}catch(e){}return true}
function openTest(){const u=waUrl('Test alert from your T-shirt website');if(!u)return toast('Save your API key first');window.open(u,'_blank')}
function notifyLogin(){const t=new Date().toLocaleString('en-IN'),dev=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Mobile':'Computer';
 DB.loginLog=(DB.loginLog||[]).concat({t,dev}).slice(-15);storageService.save();
 sendWa('🔔 Someone entered your profile of the T-shirt website (Teevora).\nTime: '+t+'\nDevice: '+dev)}
function testAlert(){if(!sendWa('✅ Test alert from your T-shirt website.'))return toast('Add your API key first');toast('Test sent – check WhatsApp')}
function saveContact(){const s=mySeller(),e=$('se').value.trim(),w=waNum($('sw').value);if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid Gmail');if(!/^\d{10,13}$/.test(w))return toast('WhatsApp: 10-13 digits with country code');s.email=e;s.wa=w;storageService.save();renderNav();toast('Saved')}
function saveKey(){mySeller().cmKey=$('sk').value.trim();storageService.save();toast('Saved');route()}
function savePw(){const e=authService.changePassword($('cp0').value,$('cp1').value,$('cp2').value);e?$('err').textContent=e:(toast('Password updated'),route())}
function cropImg(file,w,h,q=.82){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;c.getContext('2d').drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
async function setMedia(kind,input){const f=input.files[0];input.value='';if(!f)return;if(!f.type.startsWith('image/'))return toast('Only image files allowed');
 try{const s=mySeller();if(kind=='avatar')s.avatar=await cropImg(f,400,400);else s.bannerImg=await cropImg(f,1400,420);storageService.save();toast('Photo updated');route()}catch(e){toast('Could not read image')}}

const normPhone=v=>{let d=String(v).replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))d=d.slice(2);if(d.length==11&&d[0]=='0')d=d.slice(1);return d};
function showErr(m){const e=$('err');if(e){e.textContent=m;try{e.scrollIntoView({block:'center'})}catch(x){}}toast(m)}
function cleanCart(){const n=DB.cart.length;DB.cart=DB.cart.filter(l=>{const p=productService.get(l.pid),x=p&&p.sizes&&p.sizes[l.size];if(!x||!(x.stock>0))return false;if(l.qty>x.stock)l.qty=x.stock;return l.qty>0});if(DB.cart.length!=n){storageService.save();updCart()}}
window.addEventListener('error',e=>{try{toast('Error: '+e.message)}catch(x){}});

const STATUS=['Pending','Confirmed','Manufacturing','Ready','Delivering','Delivered'],LEG={Preparing:'Manufacturing',Shipped:'Delivering'};
let pfMode='all',homeTab='sell';
const cz=(p,z,k)=>{const x=p.sizes[z]||{};return x[k]!=null?x[k]:(p[k]||0)};
const costOf=o=>{const p=productService.get(o.pid);return p?o.qty*(cz(p,o.size,'mcost')+cz(p,o.size,'dcost')):0};
function stepBar(st){st=LEG[st]||st;if(st=='Cancelled')return '<b class="er">Cancelled</b>';const i=Math.max(0,STATUS.indexOf(st));return `<div class="steps">${STATUS.map((x,k)=>`<span class="${k==i?'cur':k<i?'on':''}">${x}</span>`).join('')}</div>`}

function cartWaLink(){const s=DB.shops[0],num=(s&&s.wa)||OWNER.wa;let tot=0;const ls=DB.cart.map((l,i)=>{const p=productService.get(l.pid),c=productService.calc(p,l.size,l.qty);tot+=c.final;return (i+1)+'. '+p.name+' | Size '+l.size+' | Qty '+l.qty+' | '+inr(c.final)});return 'https://wa.me/'+num+'?text='+encodeURIComponent('Hi, I want to order:\n'+ls.join('\n')+'\nTotal: '+inr(tot))}

<script>
(function(){
const R=reviewService,HK='tv_helpful';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rs=n=>`<span class="rs">${'★'.repeat(Math.round(n))}<i>${'★'.repeat(5-Math.round(n))}</i></span>`;
window._rs=0;window._rp='';
window.setRs=n=>{window._rs=n;document.querySelectorAll('.pick b').forEach((e,i)=>e.style.opacity=i<n?1:.25);const l=document.getElementById('rsl');if(l)l.textContent=['','Poor','Fair','Good','Very good','Excellent'][n]};
window.rvPhoto=inp=>{const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Choose an image');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._rp=c.toDataURL('image/jpeg',.6);document.getElementById('rpv').innerHTML='<img class="ph" src="'+window._rp+'">'};im.src=r.result};r.readAsDataURL(f)};
window.sendRv=pid=>{const c=me();if(!c)return needLogin();const t=(document.getElementById('rvt').value||'').trim();
 if(!window._rs)return toast('Please choose a star rating');if(t.length<5)return toast('Write a short review (at least 5 letters)');
 if(DB.reviews.some(r=>r.pid==pid&&r.user==c.email))return toast('You already reviewed this product');
 DB.reviews.push({id:uid(),pid,user:c.email,name:c.name,stars:window._rs,text:t,photo:window._rp,date:new Date().toISOString(),helpful:0,verified:DB.orders.some(o=>o.pid==pid&&o.mine)});
 window._rs=0;window._rp='';storageService.save();toast('Thank you for your review!');route()};
window.delRv=id=>{if(!confirm('Delete this review?'))return;DB.reviews=DB.reviews.filter(r=>r.id!=id);storageService.save();route()};
window.helpRv=id=>{const h=ld(HK,[]);if(h.includes(id))return toast('You already marked this helpful');const r=DB.reviews.find(x=>x.id==id);if(!r)return;r.helpful=(r.helpful||0)+1;sv(HK,[...h,id]);storageService.save();route()};
window.replyRv=id=>{const r=DB.reviews.find(x=>x.id==id);if(!r)return;const t=prompt('Reply to this review',r.reply?r.reply.text:'');if(t===null)return;r.reply=t.trim()?{text:t.trim(),date:new Date().toISOString()}:null;storageService.save();route()};
function sec(id,p){const l=R.of(id).slice().reverse(),n=l.length,avg=R.avg(id),c=me(),mine=c&&l.find(r=>r.user==c.email),own=mySeller()&&mySeller().id==p.shopId;
 const bars=[5,4,3,2,1].map(k=>{const q=l.filter(r=>r.stars==k).length;return `<div>${k}★<span class="b"><i style="width:${n?q/n*100:0}%"></i></span>${q}</div>`}).join('');
 const form=mine?'':c?`<div class="rvf"><b>Write a review</b><div class="pick">${[1,2,3,4,5].map(i=>`<b onclick="setRs(${i})" style="opacity:.25">★</b>`).join('')} <span class="m" id="rsl" style="font-size:13px;letter-spacing:0"></span></div><textarea id="rvt" rows="3" placeholder="How was the fit, fabric and print?"></textarea><div class="row" style="align-items:center"><label class="btn o" style="cursor:pointer">Add photo<input type="file" accept="image/*" hidden onchange="rvPhoto(this)"></label><span id="rpv"></span></div><button style="margin-top:10px" onclick="sendRv('${id}')">Submit review</button></div>`
 :`<div class="rvf"><span class="m">Login or sign up as a customer to write a review.</span> <a class="btn o" href="#/account">Login / Sign up</a></div>`;
 const items=l.map(r=>`<div class="rvi"><div class="h"><div class="av2">${esc((r.name||'?')[0].toUpperCase())}</div><div><b>${esc(r.name||'Customer')}</b>${r.verified?'<span class="vb">✓ Verified buyer</span>':''}<br>${rs(r.stars)} <span class="m" style="font-size:12px">${new Date(r.date).toLocaleDateString()}</span></div></div><p style="margin:8px 0 0">${esc(r.text)}</p>${r.photo?`<img class="ph" src="${r.photo}" alt="Review photo">`:''}${r.reply?`<div class="rrp"><b>Seller reply</b><br>${esc(r.reply.text)}</div>`:''}<div class="act"><button class="o" onclick="helpRv('${r.id}')">Helpful (${r.helpful||0})</button>${own?`<button class="o" onclick="replyRv('${r.id}')">${r.reply?'Edit reply':'Reply'}</button>`:''}${(c&&r.user==c.email)||own?`<button class="d" onclick="delRv('${r.id}')">Delete</button>`:''}</div></div>`).join('');
 return `<div class="box rvw"><h2>Customer reviews</h2>${n?`<div class="rvs"><div><div class="big">${avg.toFixed(1)}</div>${rs(avg)}<div class="m">${n} review${n>1?'s':''}</div></div><div class="bars">${bars}</div></div>`:'<p class="m">No reviews yet. Be the first to share your experience.</p>'}${form}${items}</div>`}
const _p=V.p;V.p=function(id){const h=_p(id),p=productService.get(id);return p?h+sec(id,p):h};

route();

<script>
(function(){

const gc=()=>{try{return localStorage.getItem(CK)}catch(e){return null}};
/* optional "preferences" storage only persists if the visitor accepted */
const gi=Storage.prototype.getItem,si=Storage.prototype.setItem;
Storage.prototype.getItem=function(k){return PREF.includes(k)&&gc()!='all'?sessionStorage.getItem(k):gi.call(this,k)};
Storage.prototype.setItem=function(k,v){if(PREF.includes(k)&&gc()!='all')return sessionStorage.setItem(k,v);return si.call(this,k,v)};
function set(v){try{si.call(localStorage,CK,v)}catch(e){}if(v=='all')PREF.forEach(k=>{const s=sessionStorage.getItem(k);if(s!==null)si.call(localStorage,k,s)});const b=document.getElementById('ck');if(b)b.remove();toast(v=='all'?'Preferences saved':'Only essential storage will be used')}
window.ckAll=()=>set('all');window.ckEss=()=>set('essential');
window.ckSave=()=>set(document.getElementById('ckp').checked?'all':'essential');
window.ckOpen=(manage)=>{const o=document.getElementById('ck');if(o)o.remove();const d=document.createElement('div');d.id='ck';
 d.innerHTML=`<b>Cookies &amp; privacy</b><p>Teevora keeps your cart, orders and login in your browser's storage so the shop works. We do not use advertising or tracking cookies. You can also allow optional preferences (wishlist, coupon, helpful votes). <a href="#/privacy">Privacy Policy</a> · <a href="#/cookies">Cookie Policy</a></p>
 ${manage?`<div class="ps"><label><input type="checkbox" checked disabled> <span><b style="font:600 14px Inter,sans-serif;display:inline">Essential</b> Cart, orders, account and shop data. Always on.</span></label><label><input type="checkbox" id="ckp" ${gc()=='all'?'checked':''}> <span><b style="font:600 14px Inter,sans-serif;display:inline">Preferences</b> Remember your wishlist, coupon and helpful votes on this device.</span></label></div><div class="row" style="margin-top:12px"><button onclick="ckSave()">Save choices</button></div>`
 :`<div class="row"><button onclick="ckAll()">Accept all</button><button class="o" onclick="ckEss()">Essential only</button><button class="o" onclick="ckOpen(true)">Manage</button></div>`}`;document.body.appendChild(d)};
if(!gc())setTimeout(()=>ckOpen(false),900);
/* policy pages */
const P=(t,body)=>`<div class="box pol"><h2>${t}</h2><p class="m upd">Last updated: October 2026</p>${body}<p><a class="btn o" href="#/home">Back to shop</a></p></div>`;
V.privacy=()=>P('Privacy Policy',`<p>Teevora ("we", "us") is a t-shirt shop. This policy explains what information we handle and why. We do not sell your personal information.</p>
<h3>1. Information we collect</h3><ul><li><b>Orders:</b> name, phone number, delivery address, city, state, PIN code and delivery notes that you enter at checkout.</li><li><b>Seller account:</b> there is only one account on this website, used by the shop owner. Customers do not need or create accounts.</li><li><b>Reviews:</b> your name, star rating, written review and any photo you choose to add.</li><li><b>Device storage:</b> your cart, wishlist and coupon choice (see Cookie Policy).</li></ul>
<h3>2. How we use it</h3><ul><li>To process, confirm and deliver your order, and to contact you about it.</li><li>To show your reviews and let the seller reply.</li><li>To keep your cart and account working.</li></ul>
<h3>3. Where your data is kept</h3><p>On this website, your data is stored in your own browser (local storage). It stays on your device and is not sent to a server by the site itself. If you clear your browser data, it is removed.</p>
<h3>4. Sharing</h3><ul><li><b>The seller:</b> when you tap "Order on WhatsApp" or "Contact Seller", the details in the message are sent to the seller through WhatsApp, which is run by Meta and has its own privacy policy.</li><li><b>Google Fonts:</b> the site loads fonts from Google, which may receive your IP address when the page loads.</li><li><b>Seller alerts:</b> the seller may use CallMeBot to receive login alerts. This does not include customer details.</li><li>We do not use advertising or analytics services and do not sell or rent your data.</li></ul>
<h3>5. How long we keep it</h3><p>Data stays on your device until you delete it or clear your browser. The seller keeps order details they receive for as long as needed to fulfil orders and meet legal or accounting duties.</p>
<h3>6. Your choices and rights</h3><p>You can ask the seller to correct or delete the personal information they hold about you, and you can delete your own reviews on the product page. Depending on where you live, laws such as India's Digital Personal Data Protection Act, 2023 may give you further rights. Contact us using the Contact Seller (WhatsApp) button.</p>
<h3>7. Security</h3><p>We take reasonable care, but no website or storage is completely secure. Please do not share your password with anyone and use a device you trust.</p>
<h3>8. Children</h3><p>This shop is not meant for children under 18 to buy without a parent or guardian.</p>
<h3>9. Changes</h3><p>We may update this policy. The date above shows the latest version.</p>`);
V.cookies=()=>P('Cookie Policy',`<p>Teevora does not set advertising, tracking or analytics cookies. We use your browser's local storage, which works like cookies, to run the shop.</p>
<h3>Essential (always on)</h3><ul><li>Your cart and checkout details.</li><li>Orders placed on this device.</li><li>Seller login session and shop data.</li><li>Your cookie choice.</li></ul>
<h3>Preferences (only if you accept)</h3><ul><li>Wishlist, applied coupon and the reviews you marked helpful. If you choose Essential only, these last just for the current visit.</li></ul>
<h3>Third parties</h3><p>Google Fonts and WhatsApp links are provided by other companies and may set their own technical data. See their policies for details.</p>
<h3>Change your choice</h3><p><button onclick="ckOpen(true)">Cookie settings</button></p>`);
/* legal links on every page + checkout consent note */
const bar='<div class="legal"><a href="#/privacy">Privacy Policy</a><a href="#/cookies">Cookie Policy</a><button class="lk" onclick="ckOpen(true)">Cookie settings</button></div>';
const app=document.getElementById('app');
new MutationObserver(()=>{if(app.querySelector('.legal'))return;app.insertAdjacentHTML('beforeend',bar)}).observe(app,{childList:true});
const _co=V.checkout;V.checkout=function(){return _co().replace('<h2>Checkout (guest allowed)</h2>','<h2>Checkout (guest allowed)</h2><p class="m" style="margin-top:-6px">By placing an order you agree to our <a href="#/privacy" style="text-decoration:underline">Privacy Policy</a>.</p>')};
route();
})();
</script>
<!-- ===== LOGIN SECURITY ===== -->
<script>
(function(){
const enc=new TextEncoder(),b64=u=>btoa(String.fromCharCode(...u)),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),ITER=600000,NS='Secure connection (https) is required for login.';
const subtle=(window.crypto&&crypto.subtle)||null;
async function kdf(pw,salt,it){const k=await subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256))}
async function mk(pw){const sl=crypto.getRandomValues(new Uint8Array(16));return{v:2,s:b64(sl),i:ITER,h:b64(await kdf(pw,sl,ITER))}}
async function chk(pw,r){if(!r||r.v!==2){await kdf(pw,new Uint8Array(16),ITER);return false}const x=await kdf(pw,ub(r.s),r.i),y=ub(r.h);let d=x.length^y.length;for(let i=0;i<x.length;i++)d|=x[i]^y[i];return d===0}
const teq=(a,b)=>{a=String(a);b=String(b);let d=a.length^b.length;for(let i=0;i<Math.max(a.length,b.length);i++)d|=(a.charCodeAt(i)||0)^(b.charCodeAt(i)||0);return d===0};
const COMMON=['password','passw0rd','qwerty','abc123','letmein','welcome','admin','iloveyou','monkey','dragon','football','123456','111111','000000','teeverse','teevora','saarpan','tshirt'];
function strong(pw,ctx,min){pw=pw||'';if(pw.length<min)return'Use at least '+min+' characters';if(pw.length>128)return'Password is too long (max 128)';
 const cls=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(pw)).length;if(pw.length<16&&cls<3)return'Mix upper & lower case, numbers and symbols, or use a 16+ character passphrase';
 const l=pw.toLowerCase();if(COMMON.some(w=>l.includes(w))||(ctx||[]).some(w=>w&&w.length>3&&l.includes(String(w).toLowerCase())))return'Too easy to guess. Avoid common words, your name or the shop name';
 if(/^(.)\1+$/.test(pw)||/(0123|1234|2345|3456|4567|5678|6789|abcd|qwer)/i.test(pw))return'Avoid simple sequences like 1234 or abcd';return''}
window.pwMeter=v=>{const e=document.getElementById('str2');if(!e)return;const n=[v.length>=12,v.length>=16,/[a-z]/.test(v)&&/[A-Z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;e.textContent=['Very weak','Weak','Fair','Good','Strong','Excellent'][v?n:0];e.style.color=n>=4?'#1b5a4c':n>=3?'#8a6a2f':'#a33'};
/* escalating lockout: 1 min, 5 min, 15 min, 1 hour */
const LK='tv_lock2',STEP=[60,300,900,3600];
const lget=()=>{try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return{}}},lset=o=>{try{localStorage.setItem(LK,JSON.stringify(o))}catch(e){}};
const left=k=>{const r=lget()[k];return r&&r.t>Date.now()?Math.ceil((r.t-Date.now())/1000):0};
const fail=k=>{const o=lget(),r=o[k]||{n:0,l:0,t:0};r.n++;if(r.n>=5){r.t=Date.now()+STEP[Math.min(r.l,3)]*1000;r.l++;r.n=0}o[k]=r;lset(o)};
const okk=k=>{const o=lget();delete o[k];lset(o)};
const fmt=s=>s>=60?Math.ceil(s/60)+' min':s+' s';
const wait=k=>{const w=left(k);return w?'Too many attempts. Try again in '+fmt(w):''};
/* seller */
authService.loginSeller=async function(pw){if(!subtle)return NS;pw=(pw||'').trim();let m=wait('seller');if(m)return m;const s=DB.shops[0];let ok=false;
 if(typeof s.pwh==='string'){ok=teq(pwHash(pw),s.pwh);if(ok){s.pwh=await mk(pw);s.weak=strong(pw,[s.username],12)?1:0}}else ok=await chk(pw,s.pwh);
 if(!ok){fail('seller');return'Incorrect password'}okk('seller');DB.session={...DB.session,seller:s.id};storageService.save();notifyLogin();if(s.weak)setTimeout(()=>toast('Please set a stronger password in Settings'),900);return null};
window.doLogin=async function(){const b=document.querySelector('.lock button'),er=$('err');if(!subtle)return er.textContent=NS;const s=DB.shops[0],pw=$('lp').value.trim();let m=wait('seller');if(m)return er.textContent=m;
 if(b){b.disabled=true;b.textContent='Checking…'}try{
 if(!s.pwh){const e=strong(pw,[s.username,s.name],12);if(e)return er.textContent=e;if(pw!==$('lp2').value.trim())return er.textContent='Passwords do not match';
  s.pwh=await mk(pw);DB.session={...DB.session,seller:s.id};storageService.save();notifyLogin();toast('Password created');return location.hash='#/dash/overview'}
 const e=await authService.loginSeller(pw);e?er.textContent=e:(location.hash='#/dash/overview',route())}finally{if(b){b.disabled=false;b.textContent=s.pwh?'Login':'Create password'}}};
window.savePw=async function(){const s=DB.shops[0],er=$('err'),c=$('cp0').value.trim(),n1=$('cp1').value.trim(),n2=$('cp2').value.trim();if(!subtle)return er.textContent=NS;let m=wait('seller');if(m)return er.textContent=m;
 const ok=typeof s.pwh==='string'?teq(pwHash(c),s.pwh):await chk(c,s.pwh);if(!ok){fail('seller');return er.textContent='Current password is wrong'}
 const e=strong(n1,[s.username,s.name],12);if(e)return er.textContent=e;if(n1===c)return er.textContent='Choose a different password';if(n1!==n2)return er.textContent='New passwords do not match';
 s.pwh=await mk(n1);s.weak=0;okk('seller');storageService.save();toast('Password updated');route()};
/* customers: never store plain-text passwords */
authService.registerCustomer=async function(name,email,pw){if(!subtle)return NS;email=(email||'').trim();if(!name.trim()||!/^\S+@\S+\.\S+$/.test(email))return'Enter your name and a valid email';
 const e=strong(pw,[email.split('@')[0],name],8);if(e)return e;if(DB.customers.some(c=>c.email.toLowerCase()==email.toLowerCase()))return'Account exists – please login';
 DB.customers.push({name:name.trim(),email,pwh:await mk(pw)});DB.session={...DB.session,customer:email};storageService.save();return null};
authService.loginCustomer=async function(email,pw){if(!subtle)return NS;email=(email||'').trim();const k='c:'+email.toLowerCase(),m=wait(k);if(m)return m;const c=DB.customers.find(x=>x.email.toLowerCase()==email.toLowerCase());let ok=false;
 if(c&&c.pwh)ok=await chk(pw,c.pwh);else if(c&&typeof c.pw==='string'){ok=teq(c.pw,pw);if(ok){c.pwh=await mk(pw);delete c.pw}}else await chk(pw,null);
 if(!ok){fail(k);return'Invalid email or password'}okk(k);DB.session={...DB.session,customer:c.email};storageService.save();return null};
window.custAuth=async function(login){const e=login?await authService.loginCustomer($('ae').value,$('ap').value):await authService.registerCustomer($('an').value,$('ae').value,$('ap').value);e?$('err').textContent=e:(toast('Welcome!'),route())};
(async()=>{if(!subtle)return;let ch=0;for(const c of DB.customers)if(typeof c.pw==='string'&&!c.pwh){c.pwh=await mk(c.pw);delete c.pw;ch=1}if(ch)storageService.save()})();
/* screens */
const _d=V['seller-login'];V['seller-login']=function(t){let h=_d(t);const s=DB.shops[0];if(mySeller()||!s)return h;
 if(!s.pwh)h=h.replace(/<input id="lp"[^>]*>/,'<p class="m"><b>First-time setup:</b> create a strong password for your seller account. Use 12+ characters or a long passphrase.</p><input id="lp" type="password" placeholder="New password (12+ characters)" autocomplete="new-password" oninput="pwMeter(this.value)" onkeydown="if(event.key==\'Enter\')doLogin()"><input id="lp2" type="password" placeholder="Repeat password" autocomplete="new-password"><p class="m">Strength: <b id="str2">–</b></p>');
 return h.replace('autocomplete="off"','autocomplete="current-password"')};
const _d3=V.dash;V.dash=function(t){return _d3(t).replace('New password (8+ characters)','New password (12+ characters)')};
const _ac=V.account;V.account=function(){return _ac().replace(/6\+/g,'8+')};
/* auto-logout after 15 minutes without activity */
const IDLE=15*60e3,AK='tv_act';let tt=0;const touch=()=>{const n=Date.now();if(n-tt>8000){tt=n;try{localStorage.setItem(AK,n)}catch(e){}}};
['click','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,touch,{passive:true}));
const idle=()=>mySeller()&&Date.now()-(+localStorage.getItem(AK)||0)>IDLE;
if(idle()){DB.session={};storageService.save()}touch();
setInterval(()=>{if(idle()){authService.logout();toast('Logged out after 15 minutes of inactivity');route()}},20000);
route();
})();
</script>
<!-- ===== SINGLE OWNER ACCOUNT ===== -->
<script>
(function(){
/* Only ONE account exists: the shop owner. Password is stored only as a PBKDF2 hash (never plain text). */
const OWNER_PW={"v":2,"s":"vhau4rS/nnPsndQWdgb9ZA==","i":600000,"h":"s+3ZMYKizbm87P9bBwUQLlUhPuT12xvxy9O36G5iXwo="};
const s=DB.shops[0];s.pwh=OWNER_PW;s.weak=0;s.email=OWNER.email;storageService.save();
const CLOSED='Only one seller account exists. New accounts cannot be created.';
authService.registerSeller=()=>CLOSED;
authService.registerCustomer=async()=>'Accounts are not available. You can order as a guest.';
V['seller-reg']=()=>`<div class="box"><h2>Not available</h2><p class="m">${CLOSED}</p><a class="btn" href="#/seller-login">Seller Login</a></div>`;
V.account=()=>`<div class="box"><h2>No account needed</h2><p class="m">You can browse and order as a guest. Customer accounts are not available.</p><a class="btn" href="#/home">Back to shop</a></div>`;
window.needLogin=()=>toast('Accounts are not available. You can order as a guest.');
/* no password change screen (password is fixed by the owner file) and no first-time setup */
const _d=V.dash;V.dash=function(t){return _d(t).replace(/<div class="box"><h2>Change password<\/h2>[\s\S]*?Update password<\/button><\/div>/,'')};
/* guests can leave a review with a name (no account) */
window.sendRv=function(pid){const t=(document.getElementById('rvt').value||'').trim(),nm=((document.getElementById('rvn')||{}).value||'').trim();
 if(!window._rs)return toast('Please choose a star rating');if(nm.length<2)return toast('Please enter your name');if(t.length<5)return toast('Write a short review (at least 5 letters)');
 let dv;try{dv=localStorage.getItem('tv_dev')||(localStorage.setItem('tv_dev',uid()+uid()),localStorage.getItem('tv_dev'))}catch(e){dv='x'}const u='guest:'+dv;
 if(DB.reviews.some(r=>r.pid==pid&&r.user==u))return toast('You already reviewed this product on this device');
 DB.reviews.push({id:uid(),pid,user:u,name:nm,stars:window._rs,text:t,photo:window._rp,date:new Date().toISOString(),helpful:0,verified:DB.orders.some(o=>o.pid==pid&&o.mine)});
 window._rs=0;window._rp='';storageService.save();toast('Thank you for your review!');route()};
const _p=V.p;V.p=function(id){const h=_p(id);const g=h.indexOf('Login or sign up as a customer to write a review.');if(g<0)return h;
 const form=`<div class="rvf"><b>Write a review</b><div class="pick">${[1,2,3,4,5].map(i=>`<b onclick="setRs(${i})" style="opacity:.25">★</b>`).join('')} <span class="m" id="rsl" style="font-size:13px;letter-spacing:0"></span></div><input id="rvn" placeholder="Your name" maxlength="40"><textarea id="rvt" rows="3" placeholder="How was the fit, fabric and print?"></textarea><div class="row" style="align-items:center"><label class="btn o" style="cursor:pointer">Add photo<input type="file" accept="image/*" hidden onchange="rvPhoto(this)"></label><span id="rpv"></span></div><button style="margin-top:10px" onclick="sendRv('${id}')">Submit review</button></div>`;
 return h.replace(/<div class="rvf"><span class="m">Login or sign up[\s\S]*?Login \/ Sign up<\/a><\/div>/,form)};
route();
})();
</script>
